    <script>
        // Load layout content blocks concurrently using modern fetch
        document.addEventListener('DOMContentLoaded', async () => {
            const includes = document.querySelectorAll('[data-include]')
            
            await Promise.all(Array.from(includes).map(async (el) => {
                const file = el.getAttribute('data-include')
                try {
                    const response = await fetch(file)
                    if (response.ok) {
                        const html = await response.text()
                        el.outerHTML = html
                    } else {
                        console.error(`Failed to include ${file}: ${response.statusText}`)
                    }
                } catch (err) {
                    console.error(`Error loading include ${file}:`, err)
                }
            }))
        })
    </script>
</head>
